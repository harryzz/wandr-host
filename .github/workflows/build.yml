name: build

# wandr-host builds for the HOST platform by default (no forced target in
# .cargo/config.toml), so Linux/macOS/Windows are plain `cargo build`. Android is a
# cross build via cargo-ndk and additionally needs the AOSP submodules, which build.rs
# reads to generate AIDL bindings — hence its own job with submodule caching.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   os: ubuntu-latest }
          - { name: macos-aarch64,  os: macos-latest }
          - { name: windows-x86_64, os: windows-latest }
    steps:
      - uses: actions/checkout@v4
        with:
          # Contracts (wandr-wit) + wandr-hal-sensors are required to compile; the AOSP
          # vendor submodules are Android-only. Fetch just what the desktop build needs.
          submodules: false

      - name: Fetch required submodules (contracts, hal-sensors, skia headers)
        shell: bash
        run: |
          git submodule update --init --depth 1 contracts crates/wandr-sensors-client crates/rsbinder crates/audioclient-rs vendor/skia-src vendor/libvpx

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      # skia-safe + the winit/EGL desktop backend need X11/Wayland/GL dev headers.
      # nasm: libvpx's x86 SIMD (VP8/VP9 ENCODE — Signal; kept). GStreamer is the
      # DECODE backend: dev headers + base/good/bad plugins + libav (avdec_*) + vaapi
      # (HW decode). The hand-written decoders (openh264/libde265/dav1d/vaapi) are
      # retired, so no meson/libva-dev/libgbm-dev/dav1d-toolchain here anymore.
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev \
            libasound2-dev libpulse-dev libfontconfig1-dev clang \
            pkg-config nasm \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav gstreamer1.0-vaapi

      # nasm assembles libvpx's x86 SIMD (VP8/VP9 encode). arm64 needs no external
      # assembler (NEON goes through the C compiler). GStreamer = the decode backend.
      - name: macOS system deps
        if: runner.os == 'macOS'
        run: |
          brew install nasm pkg-config gstreamer

      # Claim macOS 12 as the floor for OUR code. Task 117 removed the ffmpeg
      # bottle that used to pin this harder than MACOSX_DEPLOYMENT_TARGET does —
      # libvpx is now built from source against this same target, so the artifact
      # is materially more portable than it was. This job is aarch64 and is a
      # BUILD CHECK; x86_64 is built locally on the target Mac instead (README).
      - name: macOS deployment target
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=12.0" >> $GITHUB_ENV

      # Task 117: libvpx (BSD-3) replaced ffmpeg — built from the pinned
      # vendor/libvpx submodule and linked STATICALLY, so no libav* dev packages,
      # no GPL exposure, and no runtime .so in the artifact. Linux/macOS need NO
      # step here at all: crates/wandr-vpx-sys's build script compiles libvpx
      # itself (nasm above is its only prerequisite).
      #
      # Windows is the exception: libvpx's build is a POSIX configure that emits
      # vpx.sln for msbuild, and vcpkg's port already drives that dance AND
      # fetches NASM itself. So instead of building from source we hand
      # wandr-vpx-sys a prebuilt lib through VPX_LIB_DIR.
      #   -static-md = static lib + DYNAMIC CRT (/MD), which is what rustc's
      #   x86_64-pc-windows-msvc uses. Plain `-static` (/MT) would give LNK4098,
      #   and plain `x64-windows` would produce a vpx.dll — reintroducing exactly
      #   the runtime-DLL problem this task removes.
      - name: Windows libvpx (vcpkg, static)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install libvpx[core,realtime]:x64-windows-static-md
          $root = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md"
          echo "VPX_LIB_DIR=$root\lib"         >> $env:GITHUB_ENV
          echo "VPX_INCLUDE_DIR=$root\include" >> $env:GITHUB_ENV

      # rustc's x86_64-pc-windows-msvc finds the MSVC toolchain via vswhere, but
      # activating the VS dev environment makes `cl`/`link` unambiguously available
      # to any cc-based build in the graph.
      - name: MSVC dev environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # GStreamer is the Windows DECODE backend (the `gstreamer` feature; d3d11h26xdec
      # gives HW decode, zero-copy into ANGLE). Installed via choco; the package sets
      # GSTREAMER_1_0_ROOT_MSVC_X86_64 — forward it + pkgconfig + bin to the build env.
      # pkgconfiglite provides a real pkg-config so gstreamer-sys's system-deps resolves.
      - name: Windows GStreamer (decode backend)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install gstreamer gstreamer-devel pkgconfiglite -y --no-progress
          $root = [System.Environment]::GetEnvironmentVariable('GSTREAMER_1_0_ROOT_MSVC_X86_64','Machine')
          if (-not $root) { $root = 'C:\gstreamer\1.0\msvc_x86_64\' }
          $root = $root.TrimEnd('\')
          echo "GSTREAMER_1_0_ROOT_MSVC_X86_64=$root\" >> $env:GITHUB_ENV
          echo "PKG_CONFIG_PATH=$root\lib\pkgconfig" >> $env:GITHUB_ENV
          echo "$root\bin" >> $env:GITHUB_PATH

      # Match scripts/build-host-*.{sh,bat}: they default to P3=1 (--features p3-async).
      # It is NOT in `default`, so a plain `cargo build` yields a host with no WASI 0.3
      # surface — guests importing wasi:sockets@0.3.0 fail with "resource implementation
      # is missing".
      # `gstreamer` is the ONE decode backend — SW via avdec_*, HW via the va/d3d11/vtdec
      # plugins, zero-copy per OS (dma-buf / D3D11 / IOSurface) through wandr-video's
      # `gpu_interop`. Same feature set on every desktop OS now that the hand-written
      # decoders are retired; libvpx stays (VP8/VP9 ENCODE) via the always-on wandr-video dep.
      - name: Build (desktop, +gstreamer)
        run: cargo build --release --locked --features p3-async,gstreamer

      - name: Test (desktop, +gstreamer)
        run: cargo test --release --locked --features p3-async,gstreamer --no-run

      - uses: actions/upload-artifact@v4
        with:
          name: wandr-host-${{ matrix.name }}
          path: |
            target/release/wasm-android-host
            target/release/wasm-android-host.exe
          if-no-files-found: warn

  android:
    name: android-aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # The AOSP trees are large even shallow; cache them so only the first run pays.
      - name: Cache AOSP vendor submodules
        uses: actions/cache@v4
        with:
          path: |
            .git/modules/vendor
            vendor
          key: aosp-vendor-${{ hashFiles('.gitmodules') }}

      - name: Fetch submodules (contracts, hal-sensors, skia, AOSP)
        run: git submodule update --init --depth 1 --recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-aarch64

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build (aarch64-linux-android)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo ndk -t arm64-v8a --platform 30 build --release --locked --features p3-async

      - uses: actions/upload-artifact@v4
        with:
          name: wandr-host-android-aarch64
          path: target/aarch64-linux-android/release/wasm-android-host
          if-no-files-found: warn
