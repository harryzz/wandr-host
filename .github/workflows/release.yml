name: release

# Decoupled from `build`: this publishes a GitHub Release from an ALREADY-BUILT
# run's artifacts — it does NOT rebuild. Manual only.
#
#   Actions → release → Run workflow → enter the tag (and optionally a build run id;
#   blank = the latest successful `build` on main).
# Or:  gh workflow run release.yml -f release_tag=v0.1.0
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish (e.g. v0.1.0)'
        required: true
      run_id:
        description: 'build run id to publish (blank = latest successful build on main)'
        required: false
        default: ''

permissions:
  contents: write        # create the release + upload assets

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve build run + commit
        id: src
        run: |
          set -eu
          rid="${{ github.event.inputs.run_id }}"
          if [ -z "$rid" ]; then
            rid=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml \
                    --branch main --status success --limit 1 --json databaseId -q '.[0].databaseId')
          fi
          [ -n "$rid" ] || { echo "::error::no successful build run found on main"; exit 1; }
          sha=$(gh run view "$rid" --repo "$GITHUB_REPOSITORY" --json headSha -q .headSha)
          echo "run_id=$rid" >> "$GITHUB_OUTPUT"
          echo "sha=$sha"     >> "$GITHUB_OUTPUT"
          echo "publishing '${{ github.event.inputs.release_tag }}' from build run $rid @ ${sha}"

      - name: Download that build's artifacts
        run: gh run download "${{ steps.src.outputs.run_id }}" --repo "$GITHUB_REPOSITORY" --dir dist

      - name: Stage assets (per-platform, optional, checksums)
        run: |
          set -eu
          mkdir -p out
          # Copy each platform binary IF the build produced one — a missing artifact
          # (e.g. macOS when its runner never allocated) is skipped, not fatal.
          copy() { if [ -f "$1" ]; then cp "$1" "out/$2"; echo "  + $2"; else echo "  - $2 (not in this build — skipped)"; fi; }
          copy dist/wandr-host-linux-x86_64/wasm-android-host       wandr-host-linux-x86_64
          copy dist/wandr-host-macos-aarch64/wasm-android-host      wandr-host-macos-aarch64
          copy dist/wandr-host-windows-x86_64/wasm-android-host.exe wandr-host-windows-x86_64.exe
          copy dist/wandr-host-android-aarch64/wasm-android-host    wandr-host-android-aarch64
          chmod +x out/wandr-host-* 2>/dev/null || true
          [ -n "$(ls -A out)" ] || { echo "::error::no host binaries in the selected build"; exit 1; }
          ( cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS )

      - uses: softprops/action-gh-release@v2
        with:
          # The default GITHUB_TOKEN is blocked from the releases API on this repo
          # ("Resource not accessible by integration") even with contents:write. Use
          # a fine-grained PAT secret RELEASE_TOKEN (Contents: Read+Write on this repo)
          # if present; falls back to GITHUB_TOKEN (which will 403 until the secret
          # is added). Create: Settings → Secrets → Actions → New → RELEASE_TOKEN.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_tag }}
          target_commitish: ${{ steps.src.outputs.sha }}   # tag the exact built commit
          files: out/*
          generate_release_notes: true
          fail_on_unmatched_files: true
