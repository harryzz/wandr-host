[package]
name = "wandr-video"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Portable video codec backends for wandr:video — VP8/VP9 via libvpx, no FFmpeg."

[features]
# OFF by default so a plain `cargo build` (and the Android cross-build, which
# uses MediaCodec) needs no media library at all. The desktop host turns it on.
default = []
# VP8/VP9 ENCODE (Signal video calls) via statically-linked libvpx (BSD-3). The one
# hand-written codec kept — the decode-only GStreamer backend does not encode. Built
# from source by wandr-vpx-sys, so no system library.
libvpx = ["dep:wandr-vpx-sys"]

# GStreamer — the DESKTOP DECODE backend (backends/gstreamer.rs): one library wrapping
# every OS's HW+SW decoders (VA / DXVA / VideoToolbox + libav) via appsrc->parser->
# decoder->appsink. Links the system GStreamer. On Windows it also pulls the `windows`
# crate for the D3D11 zero-copy lane (backends/gpu_interop.rs); on Linux the dma-buf
# lane needs gstreamer-allocators (both target-gated, so the edge only activates there).
# DESKTOP only — never on Android (its HW path is JNI MediaCodec). Codec-level, NOT
# playbin: demux/transport/subtitles stay guest-side. The hand-written per-OS decoders
# (vaapi/d3d11/videotoolbox/openh264/libde265/oxideav/dav1d) were RETIRED 2026-07-26.
gstreamer = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video", "dep:gstreamer-allocators", "dep:windows"]

[dependencies]
# libvpx (BSD-3), built from vendor/libvpx and linked statically by wandr-vpx-sys.
# That crate replaced env-libvpx-sys (MPL-2.0, and structurally unable to BUILD
# libvpx — it could only consume a prebuilt one), so a plain `cargo build` now
# needs no system media library and no pre-build step.
wandr-vpx-sys = { path = "../wandr-vpx-sys", optional = true }
# GStreamer Rust bindings (LGPL, link system libgstreamer). Codec-level use only
# (appsrc/appsink + decodebin elements); no gstreamer-play / playbin.
gstreamer = { version = "0.23", optional = true }
gstreamer-app = { version = "0.23", optional = true }
gstreamer-video = { version = "0.23", optional = true }
# Pure-Rust SIMD colorspace + resize — the libswscale replacement. These are pure
# Rust (no system library, cross-compiles anywhere), so they are NOT gated: the
# shared types and conversion helpers stay available on every target.
yuv = "0.8"
fast_image_resize = "6.0"
log = "0.4"

[target.'cfg(all(target_os = "linux", not(target_os = "android")))'.dependencies]
# dma-buf memory (fd extraction) for the GStreamer zero-copy GPU lane. Linux-only:
# the crate uses `std::os::unix` (fd), so it does not compile on Windows/macOS. The
# `gstreamer` feature references `dep:gstreamer-allocators`, but that edge only
# activates on Linux (target-gated dep); the dma-buf code in backends/gstreamer.rs is
# itself `cfg(target_os = "linux")`. Windows/macOS use the D3D11/IOSurface GPU lanes.
gstreamer-allocators = { version = "0.23", optional = true }

# The `windows` crate (Microsoft DXVA/D3D11 bindings) for the GStreamer D3D11 zero-copy
# lane — backends/gpu_interop.rs (ANGLE device + readback) + the D3d11View handle. Pulled
# by the `gstreamer` feature on Windows; target-gated so non-Windows never resolves it.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

# The round-trip tests need a real codec, so they are skipped by a bare
# `cargo test` rather than failing it.
[[test]]
name = "roundtrip"
required-features = ["libvpx"]

[[test]]
name = "playback"
required-features = ["libvpx"]

# GStreamer decode through the CodecBackend seam (SW avdec + HW va/d3d11/vtdec).
# Skips the HW-only assertions where no HW decoder exists — see its header.
[[test]]
name = "gstreamer_decode"
required-features = ["gstreamer"]

[dev-dependencies]
# Demux for a timestamp-pairing test ONLY. The crate itself never parses containers —
# demux is guest-side by design (wasi-media-source/NOTES.md).
mp4 = "0.14"
